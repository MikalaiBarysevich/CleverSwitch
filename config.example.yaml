# CleverSwitch configuration example
# Copy to ~/.config/cleverswitch/config.yaml and edit as needed.

# Hook scripts and commands (all optional)
# Hooks are called asynchronously and never block the switch relay.
# Each hook receives event details via environment variables:
#
#   CLEVERSWITCH_EVENT         switch | connect | disconnect
#   CLEVERSWITCH_DEVICE        keyboard | mouse
#   CLEVERSWITCH_DEVICE_NAME   e.g. MX Keys, MX Master 3
#   CLEVERSWITCH_TARGET_HOST   1 | 2 | 3     (switch events only, 1-based)
#
# Each hook is a named entry with:
#   path                   a script to run directly (no shell)      -- mutually exclusive
#   command                a shell command (pipes, $VAR expansion)  -- with path
#   type                   CONNECT | SWITCH | DISCONNECT, or a list of them
#   timeout                seconds before the hook is killed (default: 5)
#   fire_for_all_devices   per-hook override of the global below (omit to inherit)
#
hooks:
  # By default, hooks only fire for keyboard events.
  # Set to true to fire hooks for all devices (keyboard + mouse).
  # fire_for_all_devices: false

  notifyOnSwitch:
    command: "notify-send 'CleverSwitch' \"Switched to host $CLEVERSWITCH_TARGET_HOST\""
    type: SWITCH

  syncDisplayInput:
    path: "~/.config/cleverswitch/on_connect.sh"
    type: [CONNECT, DISCONNECT]
    fire_for_all_devices: true   # this hook also fires for the mouse
    timeout: 10

# Two-host Easy-Switch fallback (optional)
#
# On some device/receiver combinations (e.g. MX Keys S + Bolt), the keyboard never emits the
# feature 0x1814 "I just switched host" notification at all — the departing host sees nothing
# but a bare disconnect, with no target-host information. When that happens, the normal
# notification-based relay has nothing to react to and neither device follows the other.
#
# peer_host_index is a fixed workaround for the common two-machine setup: it tells CleverSwitch
# which Easy-Switch host slot represents "the other machine", per device role, so that whenever
# either device disconnects here while its paired counterpart is still connected here, that
# counterpart gets sent to its own configured host too. Unlike Logitech's own Enhanced
# Easy-Switch (keyboard-only), this fallback is symmetric — pressing the mouse's Easy-Switch key
# also brings the keyboard along.
#
# It's keyed by role, not a single shared number, because each device keeps its own independent
# host pairing table — the keyboard's and the mouse's index for "the same other machine" are not
# guaranteed to match (e.g. paired in a different order). Only list the roles you actually have;
# a role with no entry is left alone (never commanded to follow).
#
# There is no way to distinguish an intentional Easy-Switch press from an ordinary RF dropout on
# the wire, so a device that merely goes out of range or loses power will also (incorrectly)
# send its counterpart away. Only enable this if you have exactly two machines and are
# comfortable with that trade-off.
#
# How to find each value: on each machine, with the device connected there, run `cleverswitch -vv`
# and look for a "getHostInfo"-style response, or ask in the project's issue tracker for a small
# helper script. Host numbers are 1-based here, like CLEVERSWITCH_TARGET_HOST.
#
# easy_switch:
#   peer_host_index:
#     keyboard: 2
#     mouse: 2




