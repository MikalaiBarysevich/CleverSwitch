# CleverSwitch configuration example
# Copy to ~/.config/cleverswitch/config.yaml and edit as needed.

# Hook scripts and commands (all optional)
# Hooks are called asynchronously and never block the switch relay.
# Each hook receives event details via environment variables:
#
#   CLEVERSWITCH_EVENT         switch | connect | disconnect
#   CLEVERSWITCH_DEVICE        keyboard | mouse
#   CLEVERSWITCH_DEVICE_NAME   e.g. MX Keys, MX Master 3
#   CLEVERSWITCH_TARGET_HOST   1 | 2 | 3     (switch events only, 1-based)
#   CLEVERSWITCH_SWITCH_SOURCE device | edge (switch events only)
#
# Each hook is a named entry with:
#   path                   a script to run directly (no shell)      -- mutually exclusive
#   command                a shell command (pipes, $VAR expansion)  -- with path
#   type                   CONNECT | SWITCH | DISCONNECT, or a list of them
#   timeout                seconds before the hook is killed (default: 5)
#   fire_for_all_devices   per-hook override of the global below (omit to inherit)
#
hooks:
  # By default, hooks only fire for keyboard events.
  # Set to true to fire hooks for all devices (keyboard + mouse).
  # fire_for_all_devices: false

  notifyOnSwitch:
    command: "notify-send 'CleverSwitch' \"Switched to host $CLEVERSWITCH_TARGET_HOST\""
    type: SWITCH

  syncDisplayInput:
    path: "~/.config/cleverswitch/on_connect.sh"
    type: [CONNECT, DISCONNECT]
    fire_for_all_devices: true   # this hook also fires for the mouse
    timeout: 10


# Logging (all optional)
# CleverSwitch writes a size-rotated log file by default, in the OS-native log directory:
#   Linux:   $XDG_STATE_HOME/cleverswitch/cleverswitch.log (default ~/.local/state/cleverswitch/)
#   macOS:   ~/Library/Logs/CleverSwitch/cleverswitch.log
#   Windows: %LOCALAPPDATA%\CleverSwitch\Logs\cleverswitch.log
# -v / -vv on the command line force DEBUG regardless of 'level'.
#
# logging:
#   level: INFO            # DEBUG | INFO | WARNING | ERROR | CRITICAL
#   file:
#     enabled: true
#     path: ~/cleverswitch.log
#     max_size_mb: 5       # 1..1024, size of one file before it rotates
#     backup_count: 3      # 1..50, rotated files kept (cleverswitch.log.1, .2, ...)


# Edge switch (optional)
# Hold the modifier and move the cursor onto an outer edge of the desktop to switch every device to the
# host mapped to that edge. Only the outer edges of all monitors together count, the cursor must move
# onto the edge while the modifier is held, and a held mouse button blocks it.
# On Wayland the cursor position cannot be read: there, pushing the mouse push_threshold counts in one
# direction while the modifier is held counts as touching that edge (needs /dev/input access, see README).
#
# edge_switch:
#   enabled: true
#   modifier: ctrl         # ctrl | alt | shift | meta (Cmd / Win / Super), or a list: [ctrl, alt]
#   cooldown_ms: 1000      # 0..60000, ignore repeats for this long after a switch
#   edges:                 # left | right | top | bottom -> host 1..3
#     left: 1
#     right: 2
#   push_threshold: 200    # Wayland only, 1..100000 raw mouse counts (about 5 mm at 1000 DPI)
