name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libhidapi-hidraw0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check

      - name: ruff check
        run: ruff check

      - name: pytest
        run: pytest
